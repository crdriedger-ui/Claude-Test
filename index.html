   1. CONSTANTS & SETUP
   ===================================================================== */

const SUBSTEPS   = 10;           // Physics sub-steps per frame (prevents tunnelling)
const CUP_HW     = 11;           // Half-width of the cup
const CUP_DEPTH  = 18;           // Depth of the cup
const GIVE_UP_OVER_PAR = 6;      // Peter picks up the ball at par + this many strokes

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1;

/** Resize the canvas to fit the window while keeping a 16:9 aspect ratio. */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  viewScale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * viewScale) + 'px';
  canvas.style.height = Math.floor(H * viewScale) + 'px';
  canvas.width  = Math.floor(W * viewScale * dpr);
  canvas.height = Math.floor(H * viewScale * dpr);
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* =====================================================================
   2. SAVE DATA (localStorage)
   ===================================================================== */

const Store = {
  key: 'peterPuttPutt.v1',
  data: { bestTotal: null, bestHoles: Array(9).fill(null), bestBonus: null, bonusUnlocked: false },
  load() {
    try {
      const saved = JSON.parse(localStorage.getItem(this.key));
      if (saved) Object.assign(this.data, saved);
    } catch (e) { /* private mode or blocked storage: play without saving */ }
  },
  save() {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
  }
};
Store.load();

/* =====================================================================
   3. SOUND (Web Audio API, all synthesized, no audio files)
   ===================================================================== */

const Sound = {
  ctx: null, master: null, noiseBuf: null, muted: false, lastBounce: 0,

  /** Audio must be started from a user gesture, so this runs on the first click/key. */
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      // One second of white noise, reused for whooshes, splashes and crowds.
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ctx = null; }
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
  },

  /** Play a simple oscillator note with an optional pitch slide. */
  tone(freq, dur, { type = 'sine', vol = 0.3, slide = null, delay = 0 } = {}) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },

  /** Play filtered noise, optionally sweeping the filter frequency. */
  noise(dur, { vol = 0.3, freq = 1000, q = 1, type = 'bandpass', sweep = null, delay = 0 } = {}) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(freq, t0);
    if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t0 + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
  },

  // ---- Named effects ----
  swing()  { this.noise(0.25, { freq: 400, sweep: 2600, q: 0.8, vol: 0.35 }); },
  hit()    { this.tone(1300, 0.07, { type: 'square', vol: 0.12, slide: 500 }); this.noise(0.05, { freq: 3500, vol: 0.25 }); },
  bounce(strength) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastBounce < 0.06) return;
    this.lastBounce = now;
    this.tone(260 + strength * 200, 0.09, { type: 'triangle', vol: clamp(strength * 0.35, 0.04, 0.3), slide: 160 });
  },
  sand()   { this.noise(0.25, { type: 'lowpass', freq: 700, vol: 0.3 }); },
  splash() {
    this.noise(0.8, { type: 'lowpass', freq: 1600, sweep: 250, vol: 0.55 });
    this.tone(500, 0.18, { slide: 120, vol: 0.18 });
    this.noise(0.3, { type: 'highpass', freq: 3000, vol: 0.15, delay: 0.1 });
  },
  sink()   { [660, 880, 1320].forEach((f, i) => this.tone(f, 0.25, { vol: 0.2, delay: i * 0.09 })); },
  cheer() {
    for (let i = 0; i < 14; i++) this.noise(0.45, { freq: rand(1000, 2600), q: 4, vol: 0.1, delay: i * 0.07 });
    [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, { type: 'triangle', vol: 0.12, delay: 0.1 + i * 0.1 }));
  },
  powerup() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, { type: 'square', vol: 0.08, delay: i * 0.06 })); },
  zap()    { this.tone(1600, 0.45, { type: 'sawtooth', vol: 0.1, slide: 180 }); this.tone(400, 0.45, { type: 'sine', vol: 0.15, slide: 1800 }); },
  fizz()   { this.noise(0.5, { type: 'highpass', freq: 4000, vol: 0.18 }); },
  burp()   { this.tone(120, 0.55, { type: 'sawtooth', vol: 0.22, slide: 55 }); this.noise(0.5, { type: 'lowpass', freq: 300, vol: 0.2 }); },
  woof()   { this.tone(320, 0.12, { type: 'square', vol: 0.12, slide: 180 }); this.tone(300, 0.12, { type: 'square', vol: 0.12, slide: 170, delay: 0.18 }); },
  squawk() { this.tone(700, 0.22, { type: 'sawtooth', vol: 0.18, slide: 1200 }); this.tone(1000, 0.25, { type: 'square', vol: 0.12, slide: 450, delay: 0.2 }); },
  sting()  { [392, 523, 659, 523].forEach((f, i) => this.tone(f, 0.18, { type: 'triangle', vol: 0.15, delay: i * 0.12 })); },
  punch()  { this.noise(0.12, { type: 'lowpass', freq: 500, vol: 0.5 }); this.tone(90, 0.15, { vol: 0.3, slide: 50 }); },
  click()  { this.tone(800, 0.05, { type: 'square', vol: 0.07 }); },
  sad()    { [392, 370, 349, 330].forEach((f, i) => this.tone(f, 0.35, { type: 'triangle', vol: 0.12, delay: i * 0.3 })); }
};

   7. LEVEL LOADING

/** Insert the cup notch into a ground polyline at cup.x. */
function insertCup(ground, cup) {
  const out = [];
  let done = false;
  for (let i = 0; i < ground.length; i++) {
    out.push(ground[i]);
    const next = ground[i + 1];
    if (!done && next && ground[i][0] <= cup.x - CUP_HW && next[0] >= cup.x + CUP_HW) {
      out.push([cup.x - CUP_HW, cup.y], [cup.x - CUP_HW, cup.y + CUP_DEPTH],
               [cup.x + CUP_HW, cup.y + CUP_DEPTH], [cup.x + CUP_HW, cup.y]);
      done = true;
    }
  }
  return out;
}

function buildLevel(def) {
  const pts = insertCup(def.ground, def.cup);
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    segs.push({ x1: pts[i][0], y1: pts[i][1], x2: pts[i + 1][0], y2: pts[i + 1][1] });
  }
  // Invisible side walls keep the ball on screen.
  segs.push({ x1: 0, y1: -3000, x2: 0, y2: H + 100 });
  segs.push({ x1: W, y1: -3000, x2: W, y2: H + 100 });
  return {
    def, pts, segs, time: 0,
    sand: def.sand || [],
    water: def.water || [],
    movers: (def.movers || []).map(m => ({ ...m, bx: m.cx, by: m.cy, vx: 0, vy: 0, facing: -1, kickCd: 0 })),
    windmills: (def.windmills || []).map(w => ({ ...w, angle: 0.4 })),
    pickups: (def.pickups || []).map(p => ({ ...p, taken: false }))
  };
}

/** Highest ground surface at x (used to place the tee). */
function groundYAt(x) {
  let best = Infinity;
  for (let i = 0; i < L.pts.length - 1; i++) {
    const [x1, y1] = L.pts[i], [x2, y2] = L.pts[i + 1];
    if (x1 === x2) continue;
    if (x >= Math.min(x1, x2) && x <= Math.max(x1, x2)) {
      const y = y1 + (y2 - y1) * (x - x1) / (x2 - x1);
      if (y < best) best = y;
    }
  }
  return best === Infinity ? 440 : best;
}

const inSand = x => L.sand.some(([a, b]) => x >= a && x <= b);

function loadHole(def) {
  L = buildLevel(def);
  game.strokes = 0;
  game.prevPos = null;

  game.pendingCutaway = false;
  ball.x = def.tee;
  ball.y = groundYAt(def.tee) - BALL_R;
  ball.vx = ball.vy = 0;
  ball.moving = ball.passive = ball.sunk = ball.hidden = false;
  ball.restTimer = 0;
  peter.facing = 1;
  peter.x = ball.x - 26;
  peter.y = ball.y + BALL_R;
  peter.swingT = -1;
  input.aiming = false;
  game.banner = { t: 0, dur: 3.2 };
}

  if (fromTitle) { game.scores = []; game.inventory = { ...START_INVENTORY }; }
  game.playingBonus = true;
  loadHole(BONUS_HOLE);
  ball.hidden = true;             // The chicken has the ball during the intro
  game.intro = { t: 0, dur: 6 };
  game.state = 'chickenIntro';
  Sound.squawk();
}

function currentDef() { return game.playingBonus ? BONUS_HOLE : HOLES[game.holeIdx]; }

/* =====================================================================
   8. PHYSICS
   ===================================================================== */

/**
 * Circle-vs-segment collision. Pushes the ball out and reflects its velocity.
 * o.vx/o.vy : velocity of the surface (moving kegs)
 * o.rot     : {cx, cy, w} rotating surface (windmill blades)
 * o.thick   : extra thickness added to the segment
 * o.bounce  : restitution override
 * Returns true if the ball touched the segment.
 */
function collideSeg(x1, y1, x2, y2, o) {
  const r = BALL_R + (o.thick || 0);
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy || 1e-6;
  let t = ((ball.x - x1) * dx + (ball.y - y1) * dy) / l2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const px = x1 + dx * t, py = y1 + dy * t;
  const ex = ball.x - px, ey = ball.y - py;
  const d2 = ex * ex + ey * ey;
  if (d2 >= r * r) return false;

  let nx, ny;
  const d = Math.sqrt(d2);
  if (d < 1e-6) { const l = Math.sqrt(l2); nx = -dy / l; ny = dx / l; }
  else { nx = ex / d; ny = ey / d; }

  // Push out of the surface.
  ball.x = px + nx * r;
  ball.y = py + ny * r;

  // Velocity of the surface at the contact point.
  let svx = o.vx || 0, svy = o.vy || 0;
  if (o.rot) { svx = -o.rot.w * (py - o.rot.cy); svy = o.rot.w * (px - o.rot.cx); }

  const rvx = ball.vx - svx, rvy = ball.vy - svy;
  const vn = rvx * nx + rvy * ny;
  const sandy = ny < -0.4 && inSand(ball.x);
  if (vn < 0) {
    let e = o.bounce != null ? o.bounce : 0.42;
    if (sandy) e = 0.08;
    if (-vn < 40 && o.bounce == null) e = 0;        // Let resting balls settle without jitter
    const tx = rvx - vn * nx, ty = rvy - vn * ny;   // Tangential part is kept
    ball.vx = tx - e * vn * nx + svx;
    ball.vy = ty - e * vn * ny + svy;
    if (-vn > 110) {
      if (sandy) Sound.sand(); else Sound.bounce(Math.min(1, -vn / 700));
      if (sandy) puff(ball.x, ball.y + BALL_R, '#e8cf8a', 6);
    }
  }
  if (ny < -0.4) {                                   // Standing on something
    ball.grounded = true;
    ball.gnx = nx; ball.gny = ny;
    if (sandy) ball.onSand = true;
  }
  return true;
}

/** Rectangle of a mover as four segments. */
function moverSegs(m) {
  const l = m.cx - m.w / 2, r = m.cx + m.w / 2, t = m.cy - m.h / 2, b = m.cy + m.h / 2;
  return [[l, t, r, t], [r, t, r, b], [r, b, l, b], [l, b, l, t]];
}

function bladeTips(w) {
  const tips = [];
  for (let k = 0; k < 4; k++) {
    const a = w.angle + k * Math.PI / 2;
    tips.push([w.x + Math.cos(a) * w.len, w.y + Math.sin(a) * w.len]);
  }
  return tips;
}

/** Collide the ball with every moving thing. Returns true if anything was touched. */
function collideDynamic() {
  let any = false;
  for (const m of L.movers) {
    const o = { vx: m.vx, vy: m.vy, bounce: m.type === 'chicken' ? 0.8 : 0.45 };
    let hit = false;
    for (const s of moverSegs(m)) hit = collideSeg(s[0], s[1], s[2], s[3], o) || hit;
    if (hit && m.type === 'chicken') chickenKick(m);
    any = any || hit;
  }
  for (const w of L.windmills) {
    const o = { rot: { cx: w.x, cy: w.y, w: w.speed }, thick: 4, bounce: 0.5 };
    for (const [tx, ty] of bladeTips(w)) any = collideSeg(w.x, w.y, tx, ty, o) || any;
  }
  return any;
}

function chickenKick(m) {
  if (m.kickCd > 0) return;
  m.kickCd = 0.8;
  const dir = ball.x < m.cx ? -1 : 1;
  ball.vx = dir * rand(380, 600);
  ball.vy = -rand(300, 480);
  Sound.squawk();
  feathers(ball.x, ball.y);
  if (Math.random() < 0.7) say(pick(LINES.chickenHit), 2.2);
}

/** One physics sub-step for the ball. */
function physicsStep(dt) {
  ball.vy += GRAVITY * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.grounded = false;
  ball.onSand = false;

  for (const s of L.segs) collideSeg(s.x1, s.y1, s.x2, s.y2, {});
  collideDynamic();

  // Rolling resistance: a constant deceleration along the ground (much higher in sand).
  if (ball.grounded) {
    const tx = -ball.gny, ty = ball.gnx;
    const vt = ball.vx * tx + ball.vy * ty;
    const decel = ball.onSand ? 700 : 75;
    let nvt = vt - Math.sign(vt) * Math.min(Math.abs(vt), decel * dt);
    nvt *= 1 - 0.3 * dt;
    ball.vx += (nvt - vt) * tx;
    ball.vy += (nvt - vt) * ty;
  }
}

/* =====================================================================
   9. SHOTS & RULES
   ===================================================================== */

function canShoot() {
  return game.state === 'play' && !ball.moving && !ball.sunk && !game.lock;
}

/** Current aim from the drag gesture: pull back to shoot the opposite way. */
function getAim() {
  const dx = input.sx - input.mx, dy = input.sy - input.my;
  const len = Math.hypot(dx, dy);
  const power = clamp(len / MAX_DRAG, 0, 1);
  const ang = Math.atan2(dy, dx);
  return { power, ang, dirX: dx };
}

function shoot(power, ang) {
  const speed = power * MAX_SPEED * (game.beerActive ? BEER_MULT : 1);
  const c = L.def.cup;
  game.prevPos = { x: ball.x, y: ball.y };
  game.shotStartDist = Math.hypot(ball.x - c.x, ball.y - c.y);
  game.lastShotCost = 1;
  game.strokes++;
  ball.vx = Math.cos(ang) * speed;
  ball.vy = Math.sin(ang) * speed;
  ball.moving = true;
  ball.passive = false;
  ball.restTimer = 0;
  ball.flightTime = 0;
  peter.swingT = 0;
  Sound.swing();
  setTimeout(() => Sound.hit(), 60);
  game.speech = null;
  if (game.beerActive) {
    game.beerActive = false;
    later(0.5, () => { Sound.burp(); say(pick(LINES.burp), 1.8); });
  }
}

/** Called once the ball stops (or lands in water / out of bounds). */
function shotFinished(result) {
  ball.moving = false;
  ball.vx = ball.vy = 0;

  // A resting ball nudged by a keg or windmill: no commentary.
  if (ball.passive) { ball.passive = false; return; }

  const c = L.def.cup;
  const dist = Math.hypot(ball.x - c.x, ball.y - c.y);
  let cat;
  if (result === 'water') cat = 'water';
  else if (inSand(ball.x) && ball.grounded) cat = 'sand';
  else if (dist < 45) cat = 'close';
  else if (dist < game.shotStartDist * 0.45) cat = 'good';
  else if (dist > game.shotStartDist * 0.85) cat = 'bad';
  else cat = 'meh';

  // Too many strokes: Peter gives up and moves on.
  if (game.strokes >= L.def.par + GIVE_UP_OVER_PAR) {
    say(LINES.giveUp[0], 2.5);
    Sound.sad();
    game.lock = true;
    later(2.6, () => completeHole(true));
    return;
  }

  say(pick(LINES[cat]), 2.8);
  if (cat === 'good' || cat === 'close') Sound.cheer();

  // Bad shots can trigger a cutaway gag.
  const badShot = cat === 'bad' || cat === 'water' || cat === 'sand';
  if (badShot && Math.random() < 0.4 && game.time - game.lastCutaway > 25) {
    game.lock = true;
    later(1.8, startCutaway);
  }
}

function waterHazard() {
  Sound.splash();
  splash(ball.x, ball.y);
  ball.hidden = true;
  ball.moving = false;
  ball.vx = ball.vy = 0;
  game.strokes++;                       // Penalty stroke
  game.lastShotCost = 2;
  floater(ball.x, ball.y - 20, '+1 PENALTY', '#ff4d4d');
  game.lock = true;
  later(0.9, () => {
    ball.x = game.prevPos.x; ball.y = game.prevPos.y;
    ball.hidden = false;
    game.lock = false;
    shotFinished('water');
  });
}

function sinkBall() {
  const c = L.def.cup;
  ball.sunk = true;
  ball.moving = false;
  ball.x = c.x; ball.y = c.y + CUP_DEPTH - BALL_R;
  Sound.sink();
  later(0.25, () => Sound.cheer());
  confetti(c.x, c.y - 10);
  say(pick(game.strokes === 1 ? LINES.holeInOne : L.def.bonus
      ? ["Ha! Ball's in! Take THAT, you giant nugget! Peter wins!"] : LINES.sunk), 3);
  if (game.strokes === 1) floater(c.x, c.y - 60, 'HOLE IN ONE!', '#ffd23f', 2.5);
  game.lock = true;
  later(2.4, () => completeHole(false));
}

function scoreName(strokes, par) {
  if (strokes === 1) return 'HOLE IN ONE!';
  const d = strokes - par;
  return ({ '-3': 'Albatross!', '-2': 'Eagle!', '-1': 'Birdie!', '0': 'Par', '1': 'Bogey', '2': 'Double Bogey', '3': 'Triple Bogey' })[d]
      || (d > 0 ? `+${d}` : `${d}`);
}

function completeHole(gaveUp) {
  const def = L.def;
  let record = false;
  if (game.playingBonus) {
    game.bonusScore = game.strokes;
    if (Store.data.bestBonus == null || game.strokes < Store.data.bestBonus) { Store.data.bestBonus = game.strokes; record = true; }
  } else {
    game.scores[game.holeIdx] = game.strokes;
    const b = Store.data.bestHoles[game.holeIdx];
    if (!gaveUp && (b == null || game.strokes < b)) { Store.data.bestHoles[game.holeIdx] = game.strokes; record = true; }
  }
  Store.save();
  game.holeResult = { strokes: game.strokes, par: def.par, gaveUp, record,
                      name: gaveUp ? 'Peter gave up' : scoreName(game.strokes, def.par) };
  game.state = 'holeComplete';
}

function nextAfterHole() {
  if (!game.playingBonus && game.holeIdx < HOLES.length - 1) {
    game.holeIdx++;
    loadHole(HOLES[game.holeIdx]);
    game.state = 'play';
  } else {
    finishRound();
  }
}

function finishRound() {
  game.newRecord = false;
  if (game.scores.length === HOLES.length && !game.playingBonus) {
    const total = game.scores.reduce((a, b) => a + b, 0);
    if (Store.data.bestTotal == null || total < Store.data.bestTotal) { Store.data.bestTotal = total; game.newRecord = true; }
    if (total <= TOTAL_PAR + BONUS_UNLOCK_MARGIN) Store.data.bonusUnlocked = true;
    Store.save();
  }
  game.state = 'scorecard';
}

/* ---------- Power-ups ---------- */

function useBeer() {
  if (!canShoot()) return;
  if (game.beerActive) return;
  if (game.inventory.beer <= 0) return say(pick(LINES.empty), 1.8);
  game.inventory.beer--;
  game.beerActive = true;
  Sound.fizz(); Sound.powerup();
  say(pick(LINES.beer), 2);
}

function useGadget() {
  if (!canShoot()) return;
  if (game.inventory.gadget <= 0) return say(pick(LINES.empty), 1.8);
  if (!game.prevPos) return say(LINES.noGadget[0], 1.8);
  game.inventory.gadget--;
  sparkle(ball.x, ball.y);
  ball.x = game.prevPos.x; ball.y = game.prevPos.y;
  sparkle(ball.x, ball.y);
  game.strokes = Math.max(0, game.strokes - game.lastShotCost);
  game.prevPos = null;
  floater(ball.x, ball.y - 30, `-${game.lastShotCost} STROKE`, '#7df9ff');
  game.flash = 0.35;
  Sound.zap();
  say(pick(LINES.gadget), 2.2);
}

function useBrian() {
  if (game.state !== 'play') return;
  if (game.inventory.brian <= 0) return say(pick(LINES.empty), 1.8);
  game.inventory.brian--;
  Sound.woof();
  // Brian's advice has absolutely no effect on the game. That's the joke.
  game.brianSpeech = { text: pick(BRIAN_ADVICE), t: 0, dur: 4.5 };
  later(4.2, () => say(pick(["...Thanks, Brian. Super helpful.", "Yeah, I'm not listening, Brian.", "Did you just read that off a coffee mug?"]), 2));
}

function collectPickup(p) {
  p.taken = true;
  game.inventory[p.type]++;
  Sound.powerup();
  sparkle(p.x, p.y);
  floater(p.x, p.y - 20, { beer: '+1 Beer Boost', gadget: "+1 Stewie's Gadget", brian: "+1 Brian's Advice" }[p.type], '#ffe066');
}

/* ---------- Cutaways ---------- */

function startCutaway() {
  game.lastCutaway = game.time;
  game.cutaway = { idx: Math.floor(Math.random() * CUTAWAYS.length), t: 0, dur: 5 };
  game.state = 'cutaway';
  game.speech = null;
  Sound.sting();
}

function endCutaway() {
  game.cutaway = null;
  game.state = 'play';
  game.lock = false;
}

/* =====================================================================
   10. EFFECTS (particles, speech, floating text)
   ===================================================================== */

function say(text, dur = 2.5) { game.speech = { text, t: 0, dur }; }
function floater(x, y, text, color, dur = 1.6) { game.floaters.push({ x, y, text, color, t: 0, dur }); }

function addParticles(n, x, y, fn) { for (let i = 0; i < n; i++) game.particles.push(fn(x, y)); }
function splash(x, y) {
  addParticles(30, x, y, () => ({ x, y, vx: rand(-160, 160), vy: rand(-380, -120), g: 900, life: rand(0.6, 1), t: 0, size: rand(2, 5), color: pick(['#8fd3ff', '#cdefff', '#4aa8e0']) }));
}
function puff(x, y, color, n) {
  addParticles(n, x, y, () => ({ x, y, vx: rand(-60, 60), vy: rand(-100, -20), g: 200, life: rand(0.3, 0.6), t: 0, size: rand(2, 4), color }));
}
function confetti(x, y) {
  addParticles(80, x, y, () => ({ x, y, vx: rand(-260, 260), vy: rand(-520, -150), g: 500, life: rand(1.2, 2.2), t: 0, size: rand(3, 6), color: pick(['#ff4d6d', '#ffd23f', '#3ec1d3', '#7bd389', '#b388eb']), spin: rand(0, 6) }));
}
function sparkle(x, y) {
  addParticles(24, x, y, () => ({ x, y, vx: rand(-150, 150), vy: rand(-150, 150), g: 0, life: rand(0.4, 0.8), t: 0, size: rand(2, 4), color: pick(['#7df9ff', '#ffffff', '#c3a6ff']) }));
}
function feathers(x, y) {
  addParticles(14, x, y, () => ({ x, y, vx: rand(-120, 120), vy: rand(-160, -40), g: 60, life: rand(1, 1.8), t: 0, size: rand(3, 6), color: '#fffbe8', spin: rand(0, 6) }));
}

function updateEffects(dt) {
  for (const p of game.particles) { p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  game.particles = game.particles.filter(p => p.t < p.life);
  for (const f of game.floaters) f.t += dt;
  game.floaters = game.floaters.filter(f => f.t < f.dur);
  if (game.speech) { game.speech.t += dt; if (game.speech.t > game.speech.dur) game.speech = null; }
  if (game.brianSpeech) { game.brianSpeech.t += dt; if (game.brianSpeech.t > game.brianSpeech.dur) game.brianSpeech = null; }
  if (game.flash > 0) game.flash -= dt;
}

/* =====================================================================
   11. UPDATE LOOP
   ===================================================================== */

function updateLevelObjects(dt) {
  L.time += dt;
  for (const m of L.movers) {
    const nx = m.bx + Math.sin(L.time * m.speed) * m.range;
    const ny = m.hop ? m.by - Math.abs(Math.sin(L.time * m.hopSpeed)) * m.hop : m.by;
    m.vx = (nx - m.cx) / dt;
    m.vy = (ny - m.cy) / dt;
    m.cx = nx; m.cy = ny;
    if (Math.abs(m.vx) > 5) m.facing = m.vx > 0 ? 1 : -1;
    m.kickCd = Math.max(0, m.kickCd - dt);
  }
  for (const w of L.windmills) w.angle += w.speed * dt;
}

function updatePlay(dt) {
  updateLevelObjects(dt);

  // Scheduled events
  for (const tm of game.timers) tm.t -= dt;
  const due = game.timers.filter(tm => tm.t <= 0);
  game.timers = game.timers.filter(tm => tm.t > 0);
  due.forEach(tm => tm.fn());
  if (game.state !== 'play') return;

  if (game.banner) { game.banner.t += dt; if (game.banner.t > game.banner.dur) game.banner = null; }

  // A resting ball can still be shoved by kegs, blades or the chicken.
  if (!ball.moving && !ball.sunk && !ball.hidden) {
    const sx = ball.x, sy = ball.y;
    if (collideDynamic()) {
      ball.x = sx; ball.y = sy;
      ball.moving = true;
      ball.passive = true;
      ball.restTimer = 0;
      ball.flightTime = 0;
      input.aiming = false;
    }
  }

  if (ball.moving) {
    const sdt = dt / SUBSTEPS;
    for (let i = 0; i < SUBSTEPS && ball.moving; i++) {
      physicsStep(sdt);

      // Water?
      for (const w of L.water) {
        if (ball.x > w.x && ball.x < w.x + w.w && ball.y > w.y) {
          if (!game.prevPos) game.prevPos = { x: L.def.tee, y: groundYAt(L.def.tee) - BALL_R };
          waterHazard(); break;
        }
      }
      if (!ball.moving) break;

      // In the cup?
      const c = L.def.cup;
      if (Math.abs(ball.x - c.x) < CUP_HW && ball.y > c.y + 2) { sinkBall(); break; }

      // Power-up pickups
      for (const p of L.pickups) {
        if (!p.taken && Math.hypot(ball.x - p.x, ball.y - p.y) < 18) collectPickup(p);
      }
    }

    if (ball.moving) {
      ball.flightTime += dt;
      const speed = Math.hypot(ball.vx, ball.vy);
      ball.restTimer = (ball.grounded && speed < 12) ? ball.restTimer + dt : 0;
      if (ball.restTimer > 0.3 || ball.flightTime > 20) shotFinished('rest');
    }
  }

  // Peter walks over to the ball when it is at rest.
  if (!ball.moving && !ball.sunk && !ball.hidden && peter.swingT < 0) {
    let facing = peter.facing;
    if (input.aiming) { const a = getAim(); if (a.power > 0.03) facing = a.dirX >= 0 ? 1 : -1; }
    if (ball.x < 40) facing = 1;
    if (ball.x > W - 40) facing = -1;
    peter.facing = facing;
    const tx = ball.x - 26 * facing;
    peter.x += (tx - peter.x) * Math.min(1, dt * 8);
    peter.y += (ball.y + BALL_R - peter.y) * Math.min(1, dt * 8);
  }
  if (peter.swingT >= 0) { peter.swingT += dt; if (peter.swingT > 0.9) peter.swingT = -1; }
}

function update(dt) {
  game.time += dt;
  switch (game.state) {
    case 'play':
      updatePlay(dt);
      updateEffects(dt);
      break;
    case 'holeComplete':
    case 'scorecard':
      updateEffects(dt);
      break;
    case 'cutaway':
      game.cutaway.t += dt;
      if (game.cutaway.t > game.cutaway.dur) endCutaway();
      break;
    case 'chickenIntro': {
      const it = game.intro;
      const before = it.t;
      it.t += dt;
      // Punch sounds during the brawl
      if (it.t > 1.6 && it.t < 4.2 && Math.floor(it.t * 5) !== Math.floor(before * 5)) Sound.punch();
      if (it.t > 4.2 && before <= 4.2) Sound.cheer();
      if (it.t > it.dur) endIntro();
      break;
    }
  }
}

function endIntro() {
  game.intro = null;
  ball.hidden = false;
  game.state = 'play';
  say("That's MY ball, you overgrown drumstick! Now watch me sink it!", 3);
}

/* =====================================================================
   12. DRAWING HELPERS
   ===================================================================== */

function ellipse(x, y, rx, ry, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x1, y1, x2, y2, color, lw = 2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function text(str, x, y, { size = 20, color = '#fff', align = 'center', outline = null, ow = 4, weight = 'bold', base = 'middle' } = {}) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (outline) { ctx.lineWidth = ow; ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function wrap(str, maxW, size) {
  ctx.font = `bold ${size}px ${FONT}`;
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

/** Immediate-mode button: draws it and registers it for click handling this frame. */
function button(label, x, y, w, h, onClick, { color = '#ffd23f', textColor = '#222', size = 22 } = {}) {
  const hover = input.mx > x && input.mx < x + w && input.my > y && input.my < y + h;
  rrect(x, y + 4, w, h, 12, 'rgba(0,0,0,.35)');
  rrect(x, y - (hover ? 2 : 0), w, h, 12, hover ? '#fff3b0' : color, '#222', 3);

/** Comic speech bubble pointing at (tx, ty). */
function speechBubble(str, tx, ty, { bg = '#fff', maxW = 260, size = 15, alpha = 1 } = {}) {
  const lines = wrap(str, maxW, size);
  ctx.font = `bold ${size}px ${FONT}`;
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + 24;
  const bh = lines.length * (size + 4) + 16;
  let bx = clamp(tx - bw / 2, 8, W - bw - 8);
  let by = ty - bh - 22;
  let below = false;
  if (by < 60) { by = ty + 30; below = true; }
  ctx.save();
  ctx.globalAlpha = alpha;
  rrect(bx, by, bw, bh, 14, bg, '#222', 3);
  // tail
  ctx.beginPath();
  const tailX = clamp(tx, bx + 18, bx + bw - 18);
  if (!below) { ctx.moveTo(tailX - 10, by + bh - 2); ctx.lineTo(tx, ty - 4); ctx.lineTo(tailX + 8, by + bh - 2); }
  else { ctx.moveTo(tailX - 10, by + 2); ctx.lineTo(tx, ty + 4); ctx.lineTo(tailX + 8, by + 2); }
  ctx.fillStyle = bg; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillRect(tailX - 8, below ? by + 2 : by + bh - 5, 15, 4);
  lines.forEach((l, i) => text(l, bx + bw / 2, by + 8 + (size + 4) * i + size / 2 + 2, { size, color: '#222' }));
  ctx.restore();
}

/** The club angle for Peter right now, based on aiming or the swing animation. */
function peterClubAngle() {
  if (peter.swingT >= 0) {
    const t = peter.swingT;
    const follow = CLUB_ADDRESS - 1.9;
    if (t < 0.15) return peter.backAng + (follow - peter.backAng) * (t / 0.15);
    if (t < 0.6) return follow;
    return follow + (CLUB_ADDRESS - follow) * ((t - 0.6) / 0.3);
  }
  if (input.aiming && canShoot()) return CLUB_ADDRESS + getAim().power * 2.5;
  return CLUB_ADDRESS;
}

    ellipse(9, -1, 4, 4, '#ff3b3b', '#600', 1.5);
    ellipse(-5, -1, 2, 2, '#7df9ff');
  } else {
    ellipse(0, 0, 10, 10, '#fff', '#888', 2);
    ellipse(-9, 2, 6, 4, '#fff', '#888', 1.5);
    ellipse(-14, 1, 2.2, 2, '#222');
    ellipse(-2, -3, 1.6, 1.6, '#222');
    ctx.fillStyle = '#d62828'; ctx.fillRect(-7, 9, 14, 3);
  }
  ctx.restore();
}

function drawPickups(t) {
  for (const p of L.pickups) {
    if (p.taken) continue;
    const bob = Math.sin(t * 3 + p.x) * 4;
    ellipse(p.x, p.y + bob, 17, 17, 'rgba(255,240,120,.35)', '#ffe066', 2);
    drawPickupIcon(p.type, p.x, p.y + bob);
  }
}

function drawBall() {
  if (ball.hidden) return;
  if (game.beerActive && !ball.moving) ellipse(ball.x, ball.y, 11 + Math.sin(game.time * 8) * 2, 11 + Math.sin(game.time * 8) * 2, 'rgba(242,177,52,.4)');
  ellipse(ball.x, ball.y, BALL_R, BALL_R, '#fff', '#333', 1.5);
  ellipse(ball.x - 2, ball.y - 2, 1.5, 1.5, '#ddd');
}

function drawAim() {
  if (!input.aiming || !canShoot()) return;
  const a = getAim();
  if (a.power < 0.02) return;
  const speed = a.power * MAX_SPEED * (game.beerActive ? BEER_MULT : 1);
  const vx = Math.cos(a.ang) * speed, vy = Math.sin(a.ang) * speed;
  // Short trajectory preview (only the first moment of flight, so it's still a challenge)
  for (let i = 1; i <= 12; i++) {
    const t = i * 0.045;
    const x = ball.x + vx * t, y = ball.y + vy * t + 0.5 * GRAVITY * t * t;
    ellipse(x, y, 3.2 - i * 0.18, 3.2 - i * 0.18, game.beerActive ? `rgba(242,177,52,${1 - i / 13})` : `rgba(255,255,255,${1 - i / 13})`);
  }
  // Drag line (what you're pulling)
  ctx.setLineDash([6, 6]);
  line(input.sx, input.sy, input.mx, input.my, 'rgba(0,0,0,.35)', 2);
  ctx.setLineDash([]);
}

function drawParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    if (p.spin != null) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin + p.t * 8);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    } else ellipse(p.x, p.y, p.size, p.size, p.color);
  }
  ctx.globalAlpha = 1;
  for (const f of game.floaters) {
    ctx.globalAlpha = 1 - f.t / f.dur;
    text(f.text, f.x, f.y - f.t * 30, { size: 18, color: f.color, outline: '#222' });
  }
  ctx.globalAlpha = 1;
}

/** The whole course: background, obstacles, ground, ball, Peter. */
function drawWorld() {
  const t = game.time;
  drawBackground(L.def.theme, t);
  L.windmills.forEach(drawWindmillTower);
  L.windmills.forEach(drawWindmillBlades);
  for (const m of L.movers) {
    if (m.type === 'keg') drawKeg(m);
    else if (m.type === 'chicken' && game.state !== 'chickenIntro') drawChicken(m.cx, m.cy + m.h / 2, m.facing, L.time);
  }
  drawWater(t);
  drawGround();
  drawCupAndFlag(t);
  drawPickups(t);
  if (!(game.state === 'chickenIntro')) {
    const mood = ball.sunk ? 'happy' : (game.speech && LINES.water.includes(game.speech.text)) ? 'sad' : 'normal';
    drawPeter(peter.x, peter.y, peter.facing, peterClubAngle(), 1, mood);
  }
  drawBall();
  drawAim();
  drawParticles();
  if (game.speech) speechBubble(game.speech.text, peter.x + 6 * peter.facing, peter.y - 90);
}

  ];
  pu.forEach((p, i) => {
    const x = 12 + i * 178, y = H - 46, w = 170, h = 36;
    const n = game.inventory[p.key];
    const active = p.key === 'beer' && game.beerActive;

    rrect(x, y, w, h, 10, active ? 'rgba(242,177,52,.9)' : n > 0 ? (hover ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.8)') : 'rgba(120,120,120,.6)', '#222', 2);

    g.addColorStop(0, '#7bd389'); g.addColorStop(0.6, '#ffd23f'); g.addColorStop(1, '#ff4d4d');

  } else if (game.beerActive) {
    text('BEER BOOST ACTIVE!', 725, H - 30, { size: 18, color: '#f2b134', outline: '#222' });
  }

  // Brian popping in with useless advice
  if (game.brianSpeech) {
    const s = game.brianSpeech;
    const slide = Math.min(1, s.t * 4, (s.dur - s.t) * 4);
    const bx = W - 60, by = H - 70 + (1 - slide) * 120;

}

function dim(a = 0.55) { ctx.fillStyle = `rgba(10,10,25,${a})`; ctx.fillRect(0, 0, W, H); }

function drawScorecard() {
  drawBackground('house', game.time);
  dim(0.45);
  rrect(40, 40, W - 80, 460, 22, '#fffdf2', '#222', 4);
  text('SCORECARD', W / 2, 78, { size: 34, color: '#1d3557' });

  const cols = HOLES.length + 1 + (game.bonusScore != null ? 1 : 0);
  const labelW = 110, cw = Math.min(66, (W - 140 - labelW) / cols);
  const x0 = (W - (labelW + cw * cols)) / 2, y0 = 118, rh = 40;
  const rows = [
    ['Hole', ...HOLES.map((_, i) => i + 1), 'Total'],
    ['Par', ...HOLES.map(h => h.par), TOTAL_PAR],
    ['Peter', ...HOLES.map((_, i) => game.scores[i] ?? '-'), game.scores.length ? game.scores.reduce((a, b) => a + (b || 0), 0) : '-'],
    ['Best', ...Store.data.bestHoles.map(b => b ?? '-'), Store.data.bestTotal ?? '-']
  ];
  if (game.bonusScore != null) {
    rows[0].push('Bonus'); rows[1].push(BONUS_HOLE.par); rows[2].push(game.bonusScore); rows[3].push(Store.data.bestBonus ?? '-');
  }
  rows.forEach((row, ri) => {
    const y = y0 + ri * rh;
    rrect(x0, y, labelW + cw * cols, rh - 4, 6, ri === 0 ? '#1d3557' : ri % 2 ? '#eef4f8' : '#fff');
    row.forEach((cell, ci) => {
      const cx = ci === 0 ? x0 + 12 : x0 + labelW + (ci - 1) * cw + cw / 2;
      let color = ri === 0 ? '#fff' : '#222';
      if (ri === 2 && ci > 0 && ci <= HOLES.length && typeof cell === 'number') color = cell < HOLES[ci - 1].par ? '#2a9d8f' : cell > HOLES[ci - 1].par ? '#e76f51' : '#222';
      text(String(cell), cx, y + rh / 2 - 2, { size: 17, color, align: ci === 0 ? 'left' : 'center' });
    });
  });

  let y = y0 + rows.length * rh + 26;
  if (game.scores.length === HOLES.length) {
    const total = game.scores.reduce((a, b) => a + b, 0);
    const diff = total - TOTAL_PAR;
    const verdict = diff <= -3 ? "Peter is a golf genius. Nobody saw this coming. Especially Peter."
      : diff <= 0 ? "Under par! Peter's buying a round at the Clam. On Quagmire's tab."
      : diff <= 6 ? "Not bad! Peter's calling it 'a moral victory.'"
      : diff <= 15 ? "Well... Peter blames the course, the weather, and Canada."
      : "Peter's been banned from three mini-golf courses. This is the fourth.";
    text(`Total: ${total}  (${diff > 0 ? '+' : ''}${diff === 0 ? 'Even' : diff})`, W / 2, y, { size: 24, color: '#222' });
    text(verdict, W / 2, y + 30, { size: 16, color: '#555' });
    if (game.newRecord) text('NEW BEST ROUND!', W / 2, y + 58, { size: 20, color: '#c1121f' });
  } else if (game.bonusScore != null) {
    text(`Chicken hole: ${game.bonusScore} strokes. The feud continues...`, W / 2, y, { size: 20, color: '#222' });
  }

  const by = 430;
  const showBonus = Store.data.bonusUnlocked && game.bonusScore == null;
  const btns = [['Play Again', () => startRound(), '#ffd23f']];
  if (showBonus) btns.push(['Secret Bonus Hole!', () => startBonus(false), '#ff9f1c']);
  btns.push(['Title', () => { game.state = 'title'; }, '#c8e7ff']);
  const bw = 210, gap = 20, total = btns.length * bw + (btns.length - 1) * gap;
  btns.forEach(([label, fn, color], i) => button(label, W / 2 - total / 2 + i * (bw + gap), by, bw, 48, fn, { size: 20, color }));
  if (showBonus && game.scores.length === HOLES.length && !game.playingBonus) {
    text('BONUS HOLE UNLOCKED! A giant chicken wants your ball.', W / 2, by - 18, { size: 14, color: '#c1121f' });
  }
}

      // Pins
      [[480, 250], [465, 262], [495, 262], [450, 274], [480, 274], [510, 274]].forEach(([x, y]) => {
        ellipse(x, y - 14, 5, 12, '#fff', '#999', 1); ctx.fillStyle = '#e63946'; ctx.fillRect(x - 5, y - 18, 10, 2);
      });
      // Watermelon rolling (and wobbling)
      const k = Math.min(1, t / 3.5);
      const wx = 480 + Math.sin(t * 5) * 20 * (1 - k), wy = 460 - k * 190, s = 1 - k * 0.7;
      ellipse(wx, wy, 34 * s, 26 * s, '#2d6a4f', '#1b4332', 3);
      for (let i = -2; i <= 2; i++) line(wx + i * 10 * s, wy - 24 * s, wx + i * 10 * s, wy + 24 * s, '#74c69d', 3 * s);
      drawPeter(200, 480, 1, null, 1.5, 'happy');
      text('LANE 6', 480, 130, { size: 30, color: '#ff5ec4', outline: '#fff', ow: 2 });
      break;
    }
    case 'lighthouse': {
      sky('#0d1b2a', '#1b263b');
      ctx.fillStyle = '#1e3a5f'; ctx.fillRect(0, 380, W, 160);
      for (let i = 0; i < 12; i++) line((i * 90 + t * 30) % W, 400 + (i % 3) * 30, (i * 90 + t * 30) % W + 30, 400 + (i % 3) * 30, 'rgba(255,255,255,.3)', 2);
      ctx.fillStyle = '#eee'; ctx.beginPath(); ctx.moveTo(200, 400); ctx.lineTo(230, 150); ctx.lineTo(290, 150); ctx.lineTo(320, 400); ctx.fill();
      ctx.fillStyle = '#e63946'; ctx.fillRect(218, 230, 84, 26); ctx.fillRect(210, 310, 100, 26);
      rrect(222, 110, 76, 40, 6, '#333');
      const lit = Math.sin(t * 3) > 0.6;
      ellipse(260, 130, 16, 12, lit ? '#ffe066' : '#444');
      drawPeter(262, 150, 1, null, 0.5, 'happy');
      // Ship heading for the rocks
      const sx = 820 - t * 50;
      ctx.fillStyle = '#6d4c41'; ctx.beginPath(); ctx.moveTo(sx, 380); ctx.lineTo(sx + 120, 380); ctx.lineTo(sx + 100, 405); ctx.lineTo(sx + 20, 405); ctx.fill();
      ctx.fillStyle = '#ffd67a'; ctx.fillRect(sx + 30, 360, 16, 12); ctx.fillRect(sx + 70, 360, 16, 12);
      text('$0.43 SAVED!', 260, 70, { size: 24, color: '#7bd389' });
      break;
    }
  }
}

function drawCutaway() {
  const c = game.cutaway;
  const cut = CUTAWAYS[c.idx];
  drawCutawayScene(cut.scene, c.t);
  // Caption bar
  rrect(20, 16, W - 40, 58, 14, 'rgba(255,255,255,.95)', '#222', 3);
  const lines = wrap(cut.text, W - 90, 18);
  lines.forEach((l, i) => text(l, W / 2, 45 + (i - (lines.length - 1) / 2) * 22, { size: 18, color: '#222' }));
  text('CUTAWAY  ·  click to skip', W - 30, H - 16, { size: 12, color: 'rgba(255,255,255,.7)', align: 'right' });
  // Wipe-in/out transition
  const a = c.t < 0.25 ? 1 - c.t / 0.25 : c.t > c.dur - 0.25 ? (c.t - (c.dur - 0.25)) / 0.25 : 0;
  if (a > 0) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- Chicken fight intro ---------- */

function drawChickenIntro() {
  const it = game.intro, t = it.t;
  drawWorld();
  const groundY = 440;
  const bx = BONUS_HOLE.tee;
  text('SECRET BONUS HOLE', W / 2, 80, { size: 34, color: '#ffd23f', outline: '#222', ow: 7 });
  if (t < 1.4) {
    // Chicken runs in and snatches the ball
    const cx = W + 80 - (W + 80 - (bx + 90)) * Math.min(1, t / 1.2);
    drawPeter(bx - 26, groundY, 1, CLUB_ADDRESS, 1, 'normal');
    drawChicken(cx, groundY, -1, t, 1);
    if (t < 1.2) ellipse(bx, groundY - BALL_R, BALL_R, BALL_R, '#fff', '#333', 1.5);
    else ellipse(cx - 44, groundY - 88, BALL_R, BALL_R, '#fff', '#333', 1.5);
    speechBubble(t < 1.2 ? 'BAWK!' : "Hey! That's my ball!", t < 1.2 ? cx : bx, groundY - 120);
  } else if (t < 4.2) {
    // The brawl: a dust cloud with limbs flying out
    const cx = 240, cy = groundY - 60;
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2 + t * 3;
      ellipse(cx + Math.cos(a) * 60 + rand(-6, 6), cy + Math.sin(a) * 40 + rand(-6, 6), 40, 32, i % 2 ? '#d9d9d9' : '#bfbfbf');
    }
    ellipse(cx, cy, 70, 50, '#cfcfcf');
    const f = Math.floor(t * 6) % 4;
    if (f === 0) line(cx + 60, cy - 10, cx + 110, cy - 30, SKIN, 8);
    if (f === 1) line(cx - 60, cy + 10, cx - 110, cy + 40, '#f4a300', 5);
    if (f === 2) line(cx + 40, cy + 30, cx + 90, cy + 60, '#3f7d3a', 10);
    if (f === 3) feathers(cx + rand(-40, 40), cy + rand(-30, 30));
    drawParticles();
    const words = ['POW!', 'BAM!', 'BAWK!', 'WHAM!', 'OOF!', 'KA-CHICK!'];
    const wi = Math.floor(t * 3) % words.length;
    ctx.save(); ctx.translate(cx + Math.sin(wi * 7) * 90, cy - 80 + Math.cos(wi * 3) * 20); ctx.rotate(Math.sin(wi) * 0.3);
    text(words[wi], 0, 0, { size: 38, color: '#ffd23f', outline: '#c1121f', ow: 7 });
    ctx.restore();
  } else {
    // Peter wins round one
    drawPeter(bx - 26, groundY, 1, CLUB_ADDRESS - 1.9, 1, 'happy');
    ellipse(bx, groundY - BALL_R, BALL_R, BALL_R, '#fff', '#333', 1.5);
    const cx = 500 + (t - 4.2) * 40;
    ctx.save(); ctx.translate(cx, groundY); ctx.rotate(0.15);
    drawChicken(0, 0, -1, 0, 1, false);
    ctx.restore();
    for (let i = 0; i < 4; i++) ellipse(cx + 18 + Math.cos(t * 5 + i * 1.6) * 20, groundY - 125 + Math.sin(t * 5 + i * 1.6) * 6, 4, 4, '#ffd23f');
    speechBubble("Got it back! Now to sink it before he wakes up!", bx, groundY - 100);
  }
  text('click to skip', W - 20, H - 16, { size: 12, color: 'rgba(255,255,255,.8)', align: 'right' });
}

/* =====================================================================
   17. MAIN DRAW
   ===================================================================== */

function draw() {
  uiButtons = [];
  ctx.clearRect(0, 0, W, H);
  switch (game.state) {
    case 'title': drawTitle(); break;
    case 'play': drawWorld(); drawHUD(); break;
    case 'paused': drawPause(); break;
    case 'holeComplete': drawHoleComplete(); break;
    case 'cutaway': drawCutaway(); break;
    case 'chickenIntro': drawChickenIntro(); break;
    case 'scorecard': drawScorecard(); break;
  }
}

/* =====================================================================
   18. INPUT
   ===================================================================== */

function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}

canvas.addEventListener('pointerdown', e => {
  Sound.init();
  const p = toGame(e);
  input.mx = p.x; input.my = p.y; input.down = true;
  canvas.setPointerCapture(e.pointerId);

  // Buttons first
  for (const b of uiButtons) {
    if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) { Sound.click(); b.onClick(); return; }
  }
  switch (game.state) {
    case 'play':
      if (canShoot()) { input.aiming = true; input.sx = p.x; input.sy = p.y; }
      break;
    case 'holeComplete': nextAfterHole(); break;
    case 'cutaway': endCutaway(); break;
    case 'chickenIntro': endIntro(); break;
  }
});

canvas.addEventListener('pointermove', e => {
  const p = toGame(e);
  input.mx = p.x; input.my = p.y;
});

canvas.addEventListener('pointerup', e => {
  const p = toGame(e);
  input.mx = p.x; input.my = p.y; input.down = false;
  if (input.aiming) {
    input.aiming = false;
    if (canShoot()) {
      const a = getAim();
      if (a.power > 0.04) {
        peter.backAng = CLUB_ADDRESS + a.power * 2.5;
        shoot(a.power, a.ang);
      }
    }
  }
});
canvas.addEventListener('pointercancel', () => { input.aiming = false; input.down = false; });

window.addEventListener('keydown', e => {
  Sound.init();
  const k = e.key.toLowerCase();
  if (k === 'm') { Sound.toggleMute(); return; }
  switch (game.state) {
    case 'title':
      if (/^[a-z]$/.test(k)) {
        game.secretBuf = (game.secretBuf + k).slice(-7);
        if (game.secretBuf === 'chicken' && !Store.data.bonusUnlocked) {
          Store.data.bonusUnlocked = true; Store.save(); Sound.squawk();
        }
      }
      if (k === 'enter' || k === ' ') startRound();
      break;
    case 'play':
      if (k === 'p' || k === 'escape') pauseGame();
      else if (k === '1') useBeer();
      else if (k === '2') useGadget();
      else if (k === '3') useBrian();
      break;
    case 'paused':
      if (k === 'p' || k === 'escape') game.state = 'play';
      break;
    case 'holeComplete':
      if (k === 'enter' || k === ' ') nextAfterHole();
      break;
    case 'cutaway':
      if (k === 'enter' || k === ' ' || k === 'escape') endCutaway();
      break;
    case 'chickenIntro':
      if (k === 'enter' || k === ' ' || k === 'escape') endIntro();
      break;
  }
  if ([' ', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
});

// Auto-pause when the tab loses focus.
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* =====================================================================
   19. MAIN LOOP
   ===================================================================== */

let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - lastTime) / 1000);   // Clamp so a lag spike can't break physics
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
